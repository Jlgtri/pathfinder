publish_to: none
name: pathfinder
description: Optimization App Framework that allows creating domain-specific AI optimization dashboards in hours instead of weeks.
version: 0.0.1+1

environment:
  sdk: ">=3.14.0 <4.0.0"
  flutter: ">=3.50.0 <4.0.0"


dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Analytics / Logging
  talker: &talker_version ^5.2.0
  talker_dio_logger: *talker_version
  talker_riverpod_logger: *talker_version

  # UI / UX
  flutter_hooks: 0.21.4
  flutter_svg: 2.4.0
  go_router: 18.1.4
  hooks_riverpod: 3.5.0
  lottie: 3.8.2
  lottie_native: 0.2.0
  material_ui: 1.11.1
  mix: 2.4.0

  # Database / Authentication
  dart_mappable: 4.10.0
  shared_preferences: 2.5.6

  # HTTP Client
  dio_compatibility_layer: 0.1.1
  dio: 5.11.1
  http: 1.6.0
  resilify: 1.4.0
  retrofit: 4.10.0

  # Other
  ack: 2.0.0-beta.3
  collection: 1.19.1
  crypto: 3.0.8
  flutter_multi_formatter: 2.13.11
  flutter_native_splash: 2.4.8
  intl: 0.20.3
  mix_annotations: 2.2.0
  path_provider: 2.1.6
  riverpod_annotation: 4.0.8

  rhttp: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  build_runner: 2.17.1
  custom_lint: &custom_lint_version ^0.8.1
  mix_lint: 2.0.1
  riverpod_lint: 3.2.0
  shared_preferences_platform_interface: 2.4.2
  source_gen: 4.3.1

  # Tools
  flutter_gen_runner: 5.15.0
  flutter_launcher_icons: 0.14.4

  # Tests
  patrol: 4.11.0
  patrol_finders: 3.7.0
  patrol_log: 0.10.2

  # build.yaml
  dart_mappable_builder: 4.10.1
  go_router_builder: 4.5.3
  mix_generator: 2.0.1
  retrofit_generator: 10.3.3
  riverpod_generator: 4.0.10

dependency_overrides:
  analyzer: 14.7.0
  analyzer_plugin: 0.14.20
  build: 5.0.0
  custom_lint: *custom_lint_version
  custom_lint_core: *custom_lint_version
  dart_style: 3.1.14
  freezed_annotation: 3.1.0
  meta: 1.19.0
  mockito: 5.8.1
  web: 1.0.0


flutter:
  uses-material-design: true

  assets:
    - source/assets/
    - source/assets/00_splash/

  fonts:
    # Only for Android
    - family: .SF Pro Text
      fonts:
        - asset: source/fonts/SF Pro Text/SF-Pro-Text-Regular.otf
          weight: 400
        - asset: source/fonts/SF Pro Text/SF-Pro-Text-Medium.otf
          weight: 500
        - asset: source/fonts/SF Pro Text/SF-Pro-Text-SemiBold.otf
          weight: 600
        - asset: source/fonts/SF Pro Text/SF-Pro-Text-Bold.otf
          weight: 700
        - asset: source/fonts/SF Pro Text/SF-Pro-Text-Heavy.otf
          weight: 900

flutter_launcher_icons:
  android: launcher_icons
  ios: true
  remove_alpha_ios: true
  image_path: source/assets/logo.png
  web:
    generate: true
  windows:
    generate: true
  macos:
    generate: true

flutter_native_splash:
  color: "#080e20"
  # background_image: source/assets/splash.png
  image: source/assets/logo.png
  fullscreen: true

flutter_gen:
  output: lib/generated/
  integrations:
    image: true
    flutter_svg: true
    rive: false
    lottie: true

patrol:
  app_name: PathFinder
  test_directory: test
  android:
    package_name: com.example.pathfinder
  ios:
    bundle_id: com.example.PathFinder
  macos:
    bundle_id: com.example.macos.PathFinder